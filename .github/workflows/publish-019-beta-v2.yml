name: Publish 0.1.9-Beta-V2

on:
  push:
    branches: [publish/0.1.9-Beta-V2]
    paths:
      - release-assets/0.1.9-Beta-V2/**
      - .github/workflows/publish-019-beta-v2.yml

permissions:
  contents: write

concurrency:
  group: publish-0.1.9-Beta-V2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: 0.1.9-Beta-V2
      TITLE: "0.1.9-Beta-V2｜修复官网启动器战斗特效不替换"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reconstruct verified Windows and source ZIPs
        shell: bash
        run: |
          set -euo pipefail
          stage="release-assets/$TAG"
          base="$RUNNER_TEMP/previous"
          mkdir "$base"
          previous="https://github.com/$GITHUB_REPOSITORY/releases/download/0.1.9-beta"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 15 \
            --output "$base/runtime.zip" "$previous/lvmeng-mod-manager-0.1.9-beta.zip"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 15 \
            --output "$base/source.zip" "$previous/lvmeng-mod-source-0.1.9-beta.zip"
          python3 "$stage/assemble.py" "$base" "$RUNNER_TEMP/$TAG" > "$RUNNER_TEMP/checked-assets.json"
          target="$(jq -er .targetCommit "$RUNNER_TEMP/checked-assets.json")"
          test "$target" != "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$target"
          test "$(git cat-file -t "$target")" = commit
          test -z "$(git ls-tree --name-only "$target" -- "$stage")"
      - name: Upload, verify, and mark the release Latest
        shell: bash
        run: |
          set -euo pipefail
          stage="release-assets/$TAG"
          out="$RUNNER_TEMP/$TAG"
          checks="$RUNNER_TEMP/checked-assets.json"
          target="$(jq -er .targetCommit "$checks")"
          repo="$GITHUB_REPOSITORY"
          endpoint="repos/$repo"
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1 ||
             gh api "$endpoint/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'The release or tag already exists. Inspect it before retrying.'
            exit 1
          fi
          mapfile -t names < <(jq -er '.assets[].name' "$checks")
          test "${#names[@]}" -eq 4
          asset_paths=()
          for name in "${names[@]}"; do asset_paths+=("$out/$name"); done
          tag_sha="$(gh api --method POST "$endpoint/git/tags" \
            -f tag="$TAG" -f message="$TITLE" -f object="$target" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --jq .sha)"
          gh api --method POST "$endpoint/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$tag_sha" >/dev/null
          gh release create "$TAG" "${asset_paths[@]}" --repo "$repo" --verify-tag --draft \
            --title "$TITLE" --notes-file "$stage/notes.md"
          release_id="$(gh api "$endpoint/releases?per_page=30" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          verify_assets() {
            gh api "$endpoint/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/uploaded-assets.json"
            python3 "$stage/assemble.py" --verify-upload "$checks" "$RUNNER_TEMP/uploaded-assets.json"
          }
          verify_assets
          gh release edit "$TAG" --repo "$repo" --draft=false --latest
          test "$(gh api "$endpoint/git/tags/$tag_sha" --jq .object.sha)" = "$target"
          test "$(gh api "$endpoint/releases/tags/$TAG" --jq .draft)" = false
          test "$(gh api "$endpoint/releases/latest" --jq .tag_name)" = "$TAG"
          verify_assets
