name: Preserve the beta label after release reordering

on:
  push:
    branches:
      - publish/set-016-beta-latest
    paths:
      - .github/workflows/set-016-beta-latest.yml

permissions:
  contents: write

jobs:
  restore-beta-label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the dated tag and restore the prerelease label
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          tag_object=$(gh api "$api/git/ref/tags/0.16-beta" --jq '.object | select(.type == "tag") | .sha')
          gh api "$api/git/tags/$tag_object" |
            jq -e '.object.sha == "18eae5c2b8ccc4060f9731a27b0d54bac5c4a724" and .tagger.date == "2026-11-14T04:24:28Z"' >/dev/null
          release="$api/releases/445005825"
          gh api "$release" | jq -e '.tag_name == "0.16-beta" and .draft == false' >/dev/null
          gh api -X PATCH "$release" -F prerelease=true -f make_latest=false |
            jq -e '.tag_name == "0.16-beta" and .prerelease == true' >/dev/null
